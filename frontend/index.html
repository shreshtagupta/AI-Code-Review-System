
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>AI Code Reviewer</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Features</a>
        </div>
    </nav>

    <!-- Welcome Section -->
    <header>
        <h1>AI Code Reviewer</h1>
        <p>Your Intelligent Coding Assistant</p>
    </header>

    <!-- Code Input Section -->
    <div class="container">

        <h2>Analyze Your Code</h2>

        <input
            type="text"
            id="filename"
            placeholder="Enter filename (example: main.py)"
        >

        <textarea
            id="code"
            placeholder="Paste your code here..."
        ></textarea>

        <button id="analyzeBtn">Analyze Code</button>

    </div>

    <!-- JavaScript Connection -->
    <script src="script.js"></script>

</body>

</html>
